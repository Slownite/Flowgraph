[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowgraph-cli"
version = "0.1.0"
description = "Explore reachable Python function call flow"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Flowgraph contributors"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
flowgraph = "flowgraph.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
